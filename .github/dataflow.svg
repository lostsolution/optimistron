<svg xmlns="http://www.w3.org/2000/svg" width="850" height="530" viewBox="0 0 850 530">
  <defs>
    <linearGradient id="df-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="df-tagline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="530" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="848" height="528" rx="11" fill="none" stroke="url(#df-border-grad)" stroke-width="1.5"/>

  <!-- Reducer flow -->
  <text font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="13" xml:space="preserve">
    <tspan x="40" y="50" fill="#58a6ff">  dispatch</tspan><tspan fill="#8b949e">(action)</tspan>
    <tspan x="40" y="78" fill="#484f58">    │</tspan>
    <tspan x="40" y="106" fill="#484f58">    ├── </tspan><tspan fill="#58a6ff">isTransitionForNamespace?</tspan>
    <tspan x="40" y="134" fill="#484f58">    │    │</tspan>
    <tspan x="40" y="162" fill="#484f58">    │    ├── </tspan><tspan fill="#8b949e">Yes</tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#c4b5fd">processTransition</tspan>
    <tspan x="40" y="190" fill="#484f58">    │    │              │</tspan>
    <tspan x="40" y="218" fill="#484f58">    │    │              ├── </tspan><tspan fill="#58a6ff">COMMIT?</tspan>
    <tspan x="40" y="246" fill="#484f58">    │    │              │    ├── </tspan><tspan fill="#8b949e">Yes</tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#3fb950">commitTransition</tspan><tspan fill="#6e7681">  state + transitions</tspan>
    <tspan x="40" y="274" fill="#484f58">    │    │              │    └── </tspan><tspan fill="#8b949e">No </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#c4b5fd">transitions only</tspan><tspan fill="#6e7681">   state untouched</tspan>
    <tspan x="40" y="302" fill="#484f58">    │    │</tspan>
    <tspan x="40" y="330" fill="#484f58">    │    └── </tspan><tspan fill="#8b949e">No </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#3fb950">boundReducer</tspan><tspan fill="#8b949e">(state, action)</tspan>
    <tspan x="40" y="358" fill="#484f58">    │</tspan>
    <tspan x="40" y="386" fill="#484f58">    └── </tspan><tspan fill="#58a6ff">state !== prev?</tspan>
    <tspan x="40" y="414" fill="#484f58">         ├── </tspan><tspan fill="#8b949e">Yes</tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#d29922">sanitizeTransitions</tspan><tspan fill="#6e7681">  replay, detect noops &amp; conflicts</tspan>
    <tspan x="40" y="442" fill="#484f58">         └── </tspan><tspan fill="#8b949e">No </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#6e7681">return as-is</tspan>
  </text>

  <!-- Divider -->
  <line x1="40" y1="470" x2="810" y2="470" stroke="#484f58" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- selectOptimistic — separate read-time concept -->
  <text font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="13" xml:space="preserve">
    <tspan x="40" y="498" fill="#58a6ff">  selectOptimistic</tspan><tspan fill="#8b949e">()</tspan><tspan fill="#484f58">    state + transitions ──▶ </tspan><tspan fill="#c4b5fd">optimistic view</tspan><tspan fill="#6e7681">   derived, never stored</tspan>
  </text>

  <!-- Decorative stars — left -->
  <text x="18" y="72" font-family="monospace" font-size="6" fill="#d946ef" opacity="0.2">✦</text>
  <text x="12" y="200" font-family="monospace" font-size="4" fill="#06b6d4" opacity="0.16">✦</text>
  <text x="20" y="340" font-family="monospace" font-size="5" fill="#8b5cf6" opacity="0.18">✦</text>
  <text x="14" y="490" font-family="monospace" font-size="4" fill="#67e8f9" opacity="0.14">✦</text>

  <!-- Decorative stars — right -->
  <text x="802" y="55" font-family="monospace" font-size="12" fill="#58a6ff" opacity="0.45">✦</text>
  <text x="826" y="125" font-family="monospace" font-size="8" fill="#8b5cf6" opacity="0.3">✦</text>
  <text x="782" y="215" font-family="monospace" font-size="6" fill="#d946ef" opacity="0.22">✦</text>
  <text x="832" y="300" font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.26">✦</text>
  <text x="810" y="390" font-family="monospace" font-size="5" fill="#c4b5fd" opacity="0.18">✦</text>
  <text x="778" y="465" font-family="monospace" font-size="4" fill="#67e8f9" opacity="0.14">✦</text>
  <text x="820" y="510" font-family="monospace" font-size="7" fill="#f43f5e" opacity="0.16">✦</text>

  <!-- Brand -->
  <a href="https://www.lostsolution.io/">
    <text x="838" y="522" font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="11" fill="url(#df-tagline-grad)" opacity="0.5" text-anchor="end">λς</text>
  </a>
</svg>
