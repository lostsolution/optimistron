<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150" viewBox="0 0 850 150">
  <defs>
    <linearGradient id="lc-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="lc-tagline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="150" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="848" height="148" rx="11" fill="none" stroke="url(#lc-border-grad)" stroke-width="1.5"/>

  <!-- Transition flow -->
  <text font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="13" xml:space="preserve">
    <tspan x="30" y="40" fill="#4ade80">  stage</tspan><tspan fill="#484f58"> ───▶ </tspan><tspan fill="#38bdf8">commit</tspan><tspan fill="#484f58">   ✓  stage optimistically, commit on success</tspan>
    <tspan x="30" y="65" fill="#484f58">    ├──────▶ </tspan><tspan fill="#c4b5fd">amend</tspan><tspan fill="#484f58">    ↻  update staged transition before committing</tspan>
    <tspan x="30" y="90" fill="#484f58">    ├──────▶ </tspan><tspan fill="#f472b6">fail</tspan><tspan fill="#484f58">     ✗  flag as failed — keep for retry/UI feedback</tspan>
    <tspan x="30" y="115" fill="#484f58">    └──────▶ </tspan><tspan fill="#facc15">stash</tspan><tspan fill="#484f58">    ↩  revert — restore trailing if TRAILING dedupe</tspan>
  </text>

  <!-- Decorative stars — left -->
  <text x="15" y="68" font-family="monospace" font-size="5" fill="#d946ef" opacity="0.18">✦</text>
  <text x="8" y="100" font-family="monospace" font-size="4" fill="#06b6d4" opacity="0.15">✦</text>

  <!-- Decorative stars — right -->
  <text x="795" y="32" font-family="monospace" font-size="12" fill="#38bdf8" opacity="0.5">✦</text>
  <text x="825" y="58" font-family="monospace" font-size="8" fill="#8b5cf6" opacity="0.3">✦</text>
  <text x="778" y="80" font-family="monospace" font-size="6" fill="#d946ef" opacity="0.22">✦</text>
  <text x="830" y="100" font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.28">✦</text>
  <text x="805" y="130" font-family="monospace" font-size="5" fill="#c4b5fd" opacity="0.18">✦</text>
  <text x="770" y="115" font-family="monospace" font-size="4" fill="#67e8f9" opacity="0.15">✦</text>
  <text x="815" y="140" font-family="monospace" font-size="7" fill="#f43f5e" opacity="0.16">✦</text>

  <!-- Brand -->
  <a href="https://www.lostsolution.io/">
    <text x="838" y="142" font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="11" fill="url(#lc-tagline-grad)" opacity="0.5" text-anchor="end">λς</text>
  </a>
</svg>
