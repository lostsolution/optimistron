<svg xmlns="http://www.w3.org/2000/svg" width="850" height="390" viewBox="0 0 850 390">
  <defs>
    <linearGradient id="sn-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sn-tagline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="850" height="390" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="848" height="388" rx="11" fill="none" stroke="url(#sn-border-grad)" stroke-width="1.5"/>

  <!-- Sanitization flow -->
  <text font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="13" xml:space="preserve">
    <tspan x="40" y="50" fill="#38bdf8">  sanitizeTransitions</tspan>
    <tspan x="40" y="78" fill="#484f58">    │</tspan>
    <tspan x="40" y="106" fill="#484f58">    └── </tspan><tspan fill="#38bdf8">for each transition Tᵢ:</tspan>
    <tspan x="40" y="134" fill="#484f58">         │</tspan>
    <tspan x="40" y="162" fill="#484f58">         ├── </tspan><tspan fill="#8b949e">apply as-if-committed</tspan><tspan fill="#484f58"> ───▶ </tspan><tspan fill="#c4b5fd">nextState</tspan>
    <tspan x="40" y="190" fill="#484f58">         │                              │</tspan>
    <tspan x="40" y="218" fill="#484f58">         │                              ├── </tspan><tspan fill="#8b949e">mutated?</tspan>
    <tspan x="40" y="246" fill="#484f58">         │                              │    ├── </tspan><tspan fill="#8b949e">No </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#facc15">DISCARD</tspan><tspan fill="#6e7681">     no-op</tspan>
    <tspan x="40" y="274" fill="#484f58">         │                              │    └── </tspan><tspan fill="#8b949e">Yes</tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#c4b5fd">merge</tspan><tspan fill="#8b949e">(working, nextState)</tspan>
    <tspan x="40" y="302" fill="#484f58">         │                              │              ├── </tspan><tspan fill="#8b949e">returns merged </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#4ade80">KEEP</tspan><tspan fill="#6e7681">        valid</tspan>
    <tspan x="40" y="330" fill="#484f58">         │                              │              ├── </tspan><tspan fill="#8b949e">throws SKIP    </tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#facc15">DISCARD</tspan><tspan fill="#6e7681">     redundant</tspan>
    <tspan x="40" y="358" fill="#484f58">         │                              │              └── </tspan><tspan fill="#8b949e">throws CONFLICT</tspan><tspan fill="#484f58"> ──▶ </tspan><tspan fill="#fb923c">KEEP+FLAG</tspan><tspan fill="#6e7681">   stale</tspan>
  </text>

  <!-- Decorative stars — left -->
  <text x="18" y="72" font-family="monospace" font-size="6" fill="#d946ef" opacity="0.2">✦</text>
  <text x="12" y="170" font-family="monospace" font-size="4" fill="#06b6d4" opacity="0.16">✦</text>
  <text x="20" y="280" font-family="monospace" font-size="5" fill="#8b5cf6" opacity="0.18">✦</text>
  <text x="14" y="355" font-family="monospace" font-size="4" fill="#67e8f9" opacity="0.14">✦</text>

  <!-- Decorative stars — right -->
  <text x="802" y="55" font-family="monospace" font-size="12" fill="#38bdf8" opacity="0.45">✦</text>
  <text x="826" y="120" font-family="monospace" font-size="8" fill="#8b5cf6" opacity="0.3">✦</text>
  <text x="782" y="195" font-family="monospace" font-size="6" fill="#d946ef" opacity="0.22">✦</text>
  <text x="832" y="260" font-family="monospace" font-size="10" fill="#06b6d4" opacity="0.26">✦</text>
  <text x="810" y="320" font-family="monospace" font-size="5" fill="#c4b5fd" opacity="0.18">✦</text>
  <text x="778" y="365" font-family="monospace" font-size="4" fill="#67e8f9" opacity="0.14">✦</text>
  <text x="820" y="378" font-family="monospace" font-size="7" fill="#f43f5e" opacity="0.16">✦</text>

  <!-- Brand -->
  <a href="https://www.lostsolution.io/">
    <text x="838" y="382" font-family="'SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace" font-size="11" fill="url(#sn-tagline-grad)" opacity="0.5" text-anchor="end">λς</text>
  </a>
</svg>
